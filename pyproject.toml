[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callprobe"
version = "0.3.0"
description = "Test whether a model can actually call your tools."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
callprobe = "callprobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/callprobe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

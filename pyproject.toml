[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callprobe"
version = "0.7.0"
description = "Test whether a model can actually call your tools."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Elad Hirsh"},
]
keywords = [
    "llm",
    "tool-calling",
    "function-calling",
    "evaluation",
    "benchmark",
    "openai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Eladhirsh/callprobe"
Repository = "https://github.com/Eladhirsh/callprobe"
Issues = "https://github.com/Eladhirsh/callprobe/issues"

[project.scripts]
callprobe = "callprobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/callprobe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

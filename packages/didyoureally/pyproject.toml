[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "didyoureally"
version = "0.1.0"
description = "Catch AI agents that tell users they did something they didn't."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Elad Hirsh", email = "eh3123@columbia.edu" }]
keywords = ["ai-agents", "llm", "evaluation", "tool-calling", "observability", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
didyoureally = "didyoureally.cli:main"
dyr = "didyoureally.cli:main"

[project.urls]
Homepage = "https://github.com/Eladhirsh/callprobe/tree/main/packages/didyoureally"
Repository = "https://github.com/Eladhirsh/callprobe"
Issues = "https://github.com/Eladhirsh/callprobe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/didyoureally"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "FURB", "RUF100"]
ignore = ["E501"]  # the formatter owns line length; prompts may run long

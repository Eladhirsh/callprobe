name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Verify release metadata guard
        run: |
          RELEASE_TAG="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" python scripts/check_release_tag.py
          if RELEASE_TAG=v-mismatched python scripts/check_release_tag.py; then
            echo "release guard accepted a mismatched tag"
            exit 1
          fi
      - run: python -m build --wheel
      - run: python -m venv /tmp/callprobe-wheel-env
      - run: /tmp/callprobe-wheel-env/bin/pip install dist/*.whl
      - name: run from outside the checkout
        working-directory: /tmp
        run: |
          /tmp/callprobe-wheel-env/bin/callprobe --version
          /tmp/callprobe-wheel-env/bin/callprobe validate
          /tmp/callprobe-wheel-env/bin/callprobe examples
          /tmp/callprobe-wheel-env/bin/callprobe init --example support --out /tmp/callprobe-support-example
          /tmp/callprobe-wheel-env/bin/callprobe validate --suite /tmp/callprobe-support-example
          /tmp/callprobe-wheel-env/bin/callprobe run --suite /tmp/callprobe-support-example \
            --model offline-placeholder --endpoint http://127.0.0.1:1/v1 --pad 0 \
            --dry-run --format json > /tmp/callprobe-plan.json
          /tmp/callprobe-wheel-env/bin/python -c 'import json; p=json.load(open("/tmp/callprobe-plan.json")); assert p["dry_run"] and p["total_requests"] == 6'
          /tmp/callprobe-wheel-env/bin/callprobe init --example github-issues --out /tmp/callprobe-github-example
          /tmp/callprobe-wheel-env/bin/callprobe validate --suite /tmp/callprobe-github-example
          /tmp/callprobe-wheel-env/bin/callprobe init --example mail-sandbox --out /tmp/callprobe-mail-example
          /tmp/callprobe-wheel-env/bin/callprobe validate --suite /tmp/callprobe-mail-example
          /tmp/callprobe-wheel-env/bin/callprobe run --suite /tmp/callprobe-mail-example \
            --model offline-placeholder --endpoint http://127.0.0.1:1/v1 --pad 0,2,4 \
            --repeats 3 --dry-run --format json > /tmp/callprobe-mail-plan.json
          /tmp/callprobe-wheel-env/bin/python -c 'import json; p=json.load(open("/tmp/callprobe-mail-plan.json")); assert p["dry_run"] and p["total_requests"] == 162'
          /tmp/callprobe-wheel-env/bin/callprobe sweep --models offline-a offline-b \
            --suite /tmp/callprobe-mail-example --endpoint http://127.0.0.1:1/v1 \
            --out /tmp/callprobe-sweep-plan --dry-run
          /tmp/callprobe-wheel-env/bin/python -c 'import json; p=json.load(open("/tmp/callprobe-sweep-plan/manifest.json")); assert p["status"] == "planned" and p["total_planned_requests"] == 36'
          /tmp/callprobe-wheel-env/bin/callprobe demo --out /tmp/callprobe-offline-demo
          /tmp/callprobe-wheel-env/bin/callprobe report /tmp/callprobe-offline-demo/candidate.json --format junit --out /tmp/callprobe-junit.xml
          /tmp/callprobe-wheel-env/bin/python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/callprobe-junit.xml"); assert len(r.findall(".//testcase")) == 18 and len(r.findall(".//failure")) == 7'
          /tmp/callprobe-wheel-env/bin/callprobe validate --suite /tmp/callprobe-offline-demo/github-issues-suite
          /tmp/callprobe-wheel-env/bin/callprobe explain /tmp/callprobe-offline-demo/candidate.json \
            --suite /tmp/callprobe-offline-demo/github-issues-suite --task comment-body-punctuation
          set +e
          /tmp/callprobe-wheel-env/bin/callprobe compare /tmp/callprobe-offline-demo/baseline.json \
            /tmp/callprobe-offline-demo/candidate.json --fail-on-regression
          demo_gate_exit=$?
          set -e
          if [ "$demo_gate_exit" -ne 1 ]; then
            echo "expected the offline demo's --fail-on-regression gate to exit 1 (its two recorded regressions), got $demo_gate_exit"
            exit 1
          fi
      - name: exercise installed offline contract comparison
        working-directory: /tmp
        run: |
          /tmp/callprobe-wheel-env/bin/callprobe demo --contracts --out /tmp/callprobe-contract-demo
          /tmp/callprobe-wheel-env/bin/callprobe compare-contracts /tmp/callprobe-contract-demo/baseline.json \
            /tmp/callprobe-contract-demo/candidate.json --suite-a /tmp/callprobe-contract-demo/nested \
            --suite-b /tmp/callprobe-contract-demo/flat --format json > /tmp/callprobe-contract-report.json
          /tmp/callprobe-wheel-env/bin/python -c 'import json; r=json.load(open("/tmp/callprobe-contract-report.json")); assert r["informational"] and r["paired"]["scored_pairs"] == 54; assert len(r["improved"]) == 27 and len(r["regressed"]) == 2'
          set +e
          /tmp/callprobe-wheel-env/bin/callprobe compare /tmp/callprobe-contract-demo/baseline.json \
            /tmp/callprobe-contract-demo/candidate.json --fail-on-regression
          contract_gate_exit=$?
          set -e
          test "$contract_gate_exit" -eq 2
      - name: exercise installed CLI with synthetic mail agent
        run: /tmp/callprobe-wheel-env/bin/python scripts/selftest_agent.py --out /tmp/callprobe-mail-selftest
      - name: save self-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-selftest
          path: /tmp/callprobe-mail-selftest

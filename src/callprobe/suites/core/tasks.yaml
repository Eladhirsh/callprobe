name: core
# Twelve seed tasks. Each category exists because it fails for a different
# reason. Grow each to roughly 30 before publishing any numbers.
tasks:
  # --- select: the obvious case, and the near-miss case -------------------
  - id: select-status-direct
    category: select
    bundle: support
    messages:
      - role: user
        content: Where is my order ORD-448120?
    expect:
      type: call
      tool: get_order_status
      args: {order_id: ORD-448120}
    tags: [easy]

  - id: select-search-not-status
    category: select
    bundle: support
    messages:
      - role: user
        content: >
          I placed something last week and I can't find the confirmation.
          My email is dana@example.com. Has it shipped?
    expect:
      type: call
      tool: search_orders
      args: {email: dana@example.com}
    tags: [near-miss]
    # The trap: get_order_status is the tempting answer but there is no id.

  - id: select-escalate-explicit
    category: select
    bundle: support
    messages:
      - role: user
        content: I want to talk to a real person about this, now.
    expect:
      type: call
      tool: escalate_to_human
      arg_checks:
        - {path: summary, op: exists}
    tags: [easy]

  # --- abstain: no tool applies. Small models fail hardest here. ----------
  - id: abstain-policy-question
    category: abstain
    bundle: support
    messages:
      - role: user
        content: What is your return policy for opened electronics?
    expect:
      type: no_call
    tags: [knowledge]
    # Without this, padding hands the model a tool that genuinely answers
    # the question and the task silently stops testing abstention.
    exclude_distractors: [search_knowledge_base]

  - id: abstain-missing-identifier
    category: abstain
    bundle: support
    messages:
      - role: user
        content: Can you refund my order? It arrived broken.
    expect:
      type: no_call
    tags: [underspecified]
    # Correct behavior is to ask which order, not to invent an order id.

  - id: abstain-chitchat
    category: abstain
    bundle: scheduling
    messages:
      - role: user
        content: Thanks, that's all I needed. Have a good weekend.
    expect:
      type: no_call
    tags: [easy]

  # --- args: right tool, wrong values. The dangerous failure. -------------
  - id: args-partial-refund
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          Order ORD-991003 came to $84.50 and one of the two mugs was cracked.
          Refund me for just the broken one, they were the same price.
    expect:
      type: call
      tool: issue_refund
      args: {order_id: ORD-991003, reason: damaged}
      arg_checks:
        - {path: amount_cents, op: eq, value: 4225, note: half of 8450}
    tags: [arithmetic]

  - id: args-enum-mapping
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          I ordered a blue jacket on ORD-100200 and received a red one.
          Please refund it.
    expect:
      type: call
      tool: issue_refund
      args: {order_id: ORD-100200, reason: wrong_item}
    tags: [enum]

  - id: args-nested-address
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          Please send ORD-772341 to my new place instead: 55 Riverside Drive,
          apartment 12B, New York NY 10024, United States.
    expect:
      type: call
      tool: update_shipping_address
      args: {order_id: ORD-772341}
      arg_checks:
        - {path: address.postal_code, op: eq, value: "10024"}
        - {path: address.country, op: eq, value: US}
        - {path: address.city, op: eq, value: New York}
        - {path: address.line1, op: contains, value: Riverside}
    tags: [nested, normalization]

  - id: args-relative-dates
    category: args
    bundle: scheduling
    messages:
      - role: system
        content: Today is Monday, 2026-09-07. The user's timezone is America/New_York.
      - role: user
        content: Find me a free hour on my calendar cal_main sometime next week.
    expect:
      type: call
      tool: find_availability
      args: {calendar_id: cal_main, duration_minutes: 60}
      arg_checks:
        - {path: start_date, op: matches, value: "2026-09-1[2345]"}
        - {path: end_date, op: matches, value: "2026-09-(1[89]|20)"}
    tags: [dates]

  # --- depth: accuracy on turn one says nothing about turn nine ----------
  - id: depth-late-reference
    category: depth
    bundle: support
    messages:
      - role: user
        content: Hi, I have a question about a delivery.
      - role: assistant
        content: Of course. Do you have the order number?
      - role: user
        content: It's ORD-330045.
      - role: assistant
        content: Thanks. What would you like to know about it?
      - role: user
        content: Actually first, is the tracking showing anything yet?
      - role: assistant
        content: Let me check that for you.
      - role: user
        content: Wait, before that, just confirm the status of that order.
    expect:
      type: call
      tool: get_order_status
      args: {order_id: ORD-330045}
    tags: [coreference]

  # --- sequence: the first call in a chain, not the last ------------------
  - id: sequence-availability-first
    category: sequence
    bundle: scheduling
    messages:
      - role: system
        content: Today is 2026-09-07.
      - role: user
        content: >
          Book a 30 minute sync with priya@example.com on calendar cal_main
          on the first free slot this Thursday. Call it Weekly sync.
    expect:
      type: call
      tool: find_availability
      also_acceptable: []
      args: {calendar_id: cal_main, duration_minutes: 30}
    tags: [ordering]
    # book_meeting requires a slot known to be free, so calling it first is wrong.
  # =====================================================================
  # Batch two. Every expectation here is one a careful human would defend.
  # Where a reading was ambiguous, the prompt or the tool description was
  # tightened rather than the check widened.
  # =====================================================================

  # --- abstain ------------------------------------------------------------
  - id: abstain-status-no-identifier
    category: abstain
    bundle: support
    messages:
      - role: user
        content: Has my package gone out yet?
    expect:
      type: no_call
    tags: [underspecified]

  - id: abstain-no-such-capability
    category: abstain
    bundle: support
    messages:
      - role: user
        content: Please cancel order ORD-620114 before it ships.
    expect:
      type: no_call
    tags: [missing-capability]
    # Nothing here cancels an order. Refunding one is not the same action.

  - id: abstain-change-email-on-file
    category: abstain
    bundle: support
    messages:
      - role: user
        content: Can you update the email address on my account to elad@example.com?
    expect:
      type: no_call
    tags: [missing-capability]

  - id: abstain-shipping-quote
    category: abstain
    bundle: support
    messages:
      - role: user
        content: How much would it cost to ship a 2kg box to 10024?
    expect:
      type: no_call
    tags: [missing-capability]
    exclude_distractors: [get_shipping_rates]
    # get_shipping_rates answers this exactly, so padding must not add it.

  - id: abstain-availability-no-calendar
    category: abstain
    bundle: scheduling
    messages:
      - role: user
        content: Am I free for an hour on Tuesday afternoon?
    expect:
      type: no_call
    tags: [underspecified]
    # find_availability requires a calendar_id and none was given.

  - id: abstain-reschedule-unsupported
    category: abstain
    bundle: scheduling
    messages:
      - role: user
        content: Move my 3pm on Thursday to 4pm instead.
    expect:
      type: no_call
    tags: [missing-capability, underspecified]

  - id: abstain-cancel-without-id
    category: abstain
    bundle: scheduling
    messages:
      - role: user
        content: Cancel my standup tomorrow morning please.
    expect:
      type: no_call
    tags: [underspecified]

  - id: abstain-gratitude-midconversation
    category: abstain
    bundle: support
    messages:
      - role: user
        content: Where is ORD-118820?
      - role: assistant
        content: It shipped Tuesday and is due Friday.
      - role: user
        content: Perfect, thank you.
    expect:
      type: no_call
    tags: [easy, depth]

  # --- args ---------------------------------------------------------------
  - id: args-full-refund-omits-amount
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          ORD-450917 turned up three weeks after the delivery date. Refund the
          whole thing.
    expect:
      type: call
      tool: issue_refund
      args: {order_id: ORD-450917, reason: late}
      arg_checks:
        - {path: amount_cents, op: absent, note: omit to refund in full}
    tags: [omission]

  - id: args-dollars-to-cents
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          One item on ORD-771230 was a duplicate charge of $12.99. I changed my
          mind about that one, refund just that amount.
    expect:
      type: call
      tool: issue_refund
      args: {order_id: ORD-771230, reason: changed_mind}
      arg_checks:
        - {path: amount_cents, op: eq, value: 1299}
    tags: [units]

  - id: args-country-name-to-iso
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          Redirect ORD-310884 to 14 Bedford Square, London, WC1B 3JA,
          United Kingdom.
    expect:
      type: call
      tool: update_shipping_address
      args: {order_id: ORD-310884}
      arg_checks:
        - {path: address.country, op: eq, value: GB}
        - {path: address.postal_code, op: eq, value: WC1B 3JA}
        - {path: address.city, op: eq, value: London}
    tags: [normalization]
    # GB is the ISO code. UK is a common and wrong answer.

  - id: args-filtered-search
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          Show me the three most recent orders on noa@example.com that have
          already shipped.
    expect:
      type: call
      tool: search_orders
      args: {email: noa@example.com, status: shipped, limit: 3}
    tags: [enum, optional-args]

  - id: args-duration-in-words
    category: args
    bundle: scheduling
    messages:
      - role: system
        content: Today is 2026-09-07.
      - role: user
        content: >
          Find me an hour and a half on cal_design between the 9th and the
          11th of this month.
    expect:
      type: call
      tool: find_availability
      args:
        calendar_id: cal_design
        duration_minutes: 90
        start_date: "2026-09-09"
        end_date: "2026-09-11"
    tags: [units]

  - id: args-explicit-datetime
    category: args
    bundle: scheduling
    messages:
      - role: system
        content: >
          Today is 2026-09-07. The user is in America/New_York, which is at
          UTC-04:00 on this date.
      - role: user
        content: >
          Book 45 minutes on cal_main this Wednesday at 2pm with
          omer@example.com and tal@example.com. Title it Design review.
    expect:
      type: call
      tool: book_meeting
      args: {calendar_id: cal_main, duration_minutes: 45, title: Design review}
      arg_checks:
        - {path: start_time, op: matches, value: "2026-09-09T14:00(:00)?-04:00"}
        - {path: attendees.0, op: exists}
        - {path: attendees.1, op: exists}
    tags: [dates, arrays]

  - id: args-boolean-from-instruction
    category: args
    bundle: scheduling
    messages:
      - role: user
        content: Cancel meeting mtg_4471, and do not send anyone a notification.
    expect:
      type: call
      tool: cancel_meeting
      args: {meeting_id: mtg_4471, notify_attendees: false}
    tags: [booleans]

  - id: args-escalation-urgency
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          This is the fourth time I have asked and my wedding is Saturday.
          I want to speak to a person right now.
    expect:
      type: call
      tool: escalate_to_human
      arg_checks:
        - {path: summary, op: exists}
        - {path: urgency, op: eq, value: high}
    tags: [enum, inference]

  # --- select -------------------------------------------------------------
  - id: select-address-change
    category: select
    bundle: support
    messages:
      - role: user
        content: >
          ORD-905512 has not shipped yet and I moved last weekend. I need it
          going somewhere else.
    expect:
      type: call
      tool: update_shipping_address
      args: {order_id: ORD-905512}
    tags: [near-miss]

  - id: select-cancel-with-id
    category: select
    bundle: scheduling
    messages:
      - role: user
        content: Drop meeting mtg_2210 from the calendar.
    expect:
      type: call
      tool: cancel_meeting
      args: {meeting_id: mtg_2210}
    tags: [easy]

  - id: select-availability-not-booking
    category: select
    bundle: scheduling
    messages:
      - role: system
        content: Today is 2026-09-07.
      - role: user
        content: >
          What thirty minute slots are open on cal_ops between the 14th and
          the 18th? Do not book anything yet.
    expect:
      type: call
      tool: find_availability
      args:
        calendar_id: cal_ops
        duration_minutes: 30
        start_date: "2026-09-14"
        end_date: "2026-09-18"
    tags: [ordering]

  # --- depth --------------------------------------------------------------
  - id: depth-corrected-identifier
    category: depth
    bundle: support
    messages:
      - role: user
        content: Can you check on ORD-111111 for me?
      - role: assistant
        content: Sure, one moment.
      - role: user
        content: Sorry, wrong number. It is ORD-222222.
    expect:
      type: call
      tool: get_order_status
      args: {order_id: ORD-222222}
    tags: [correction]

  - id: depth-reason-stated-earlier
    category: depth
    bundle: support
    messages:
      - role: user
        content: The blender on ORD-664200 arrived with a cracked jug.
      - role: assistant
        content: I am sorry about that. Would you like a replacement or a refund?
      - role: user
        content: A refund for the whole order, please.
    expect:
      type: call
      tool: issue_refund
      args: {order_id: ORD-664200, reason: damaged}
      arg_checks:
        - {path: amount_cents, op: absent}
    tags: [coreference, omission]

  # --- sequence -----------------------------------------------------------
  - id: sequence-address-before-status
    category: sequence
    bundle: support
    messages:
      - role: user
        content: >
          First change the delivery address on ORD-505050 to 9 Alon Street,
          Tel Aviv, 6100000, Israel, and then tell me the delivery estimate.
    expect:
      type: call
      tool: update_shipping_address
      args: {order_id: ORD-505050}
      arg_checks:
        - {path: address.country, op: eq, value: IL}
    tags: [ordering]

  # =====================================================================
  # Batch three. Grows depth and sequence, which were thin (3 and 2 task
  # templates). Most of the new tasks live in a new files bundle so depth
  # and sequence are not just support and scheduling in different words.
  # Existing tasks above are untouched.
  # =====================================================================

  # --- depth: files bundle -------------------------------------------------
  - id: depth-file-share-after-detour
    category: depth
    bundle: files
    messages:
      - role: user
        content: I've got file_881020 open, it's the shared Q3 numbers.
      - role: assistant
        content: Sure, what would you like to do with it?
      - role: user
        content: Actually, remind me, what folder is that file even in?
      - role: assistant
        content: Let me pull that up for you.
      - role: user
        content: >
          Never mind, forget the folder question. Just share the file with
          dor@example.com so she can edit it.
    expect:
      type: call
      tool: share_file
      args: {file_id: file_881020, email: dor@example.com, role: editor}
    tags: [coreference, distraction]
    # The mid-conversation detour must not make the model lose file_881020.

  - id: depth-file-corrected-id
    category: depth
    bundle: files
    messages:
      - role: user
        content: Can you delete file_100001? It's a duplicate upload.
      - role: assistant
        content: Sure, one moment.
      - role: user
        content: Sorry, wrong id, I meant file_100002.
    expect:
      type: call
      tool: delete_file
      args: {file_id: file_100002}
    tags: [correction]

  - id: depth-file-permanent-carried-forward
    category: depth
    bundle: files
    messages:
      - role: user
        content: >
          file_552210 has last year's numbers in it by mistake, and I don't
          want it sitting in the trash where someone could restore it.
      - role: assistant
        content: Understood. Would you like me to remove it now?
      - role: user
        content: Yes, get rid of it.
    expect:
      type: call
      tool: delete_file
      args: {file_id: file_552210, permanent: true}
    tags: [omission, inference]
    # "not sitting in the trash" stated two turns earlier has to survive
    # into the permanent flag when the actual delete instruction lands.

  - id: depth-file-move-after-distraction
    category: depth
    bundle: files
    messages:
      - role: user
        content: I need to clean up file_330071, it's cluttering my main folder.
      - role: assistant
        content: What would you like to do with it?
      - role: user
        content: Hold on, first, does file_330071 have any editors on it right now?
      - role: assistant
        content: Let me check that.
      - role: user
        content: Actually skip that, just move it into folder_archive_2026.
    expect:
      type: call
      tool: move_file
      args: {file_id: file_330071, destination_folder_id: folder_archive_2026}
    tags: [distraction]

  # --- depth: scheduling bundle ---------------------------------------------
  - id: depth-meeting-id-corrected
    category: depth
    bundle: scheduling
    messages:
      - role: user
        content: Cancel meeting mtg_7734.
      - role: assistant
        content: Sure, one moment.
      - role: user
        content: Wait, that's the wrong one. I meant mtg_7735.
    expect:
      type: call
      tool: cancel_meeting
      args: {meeting_id: mtg_7735}
    tags: [correction]

  - id: depth-notify-preference-earlier
    category: depth
    bundle: scheduling
    messages:
      - role: user
        content: >
          Whatever I cancel today, please don't notify anyone, most of the
          team is on vacation and it'll just clutter their inbox.
      - role: assistant
        content: Noted. What would you like to cancel?
      - role: user
        content: Cancel mtg_9012.
    expect:
      type: call
      tool: cancel_meeting
      args: {meeting_id: mtg_9012, notify_attendees: false}
    tags: [omission, inference]

  # --- depth: support bundle -------------------------------------------------
  - id: depth-refund-amount-after-clarification
    category: depth
    bundle: support
    messages:
      - role: user
        content: >
          One of the two lamps on ORD-340221 showed up broken, they were $30
          each so a $60 order.
      - role: assistant
        content: >
          I'm sorry to hear that. Do you want a refund for just the broken
          lamp, or the whole order?
      - role: user
        content: Just the broken one.
    expect:
      type: call
      tool: issue_refund
      args: {order_id: ORD-340221, reason: damaged}
      arg_checks:
        - {path: amount_cents, op: eq, value: 3000, note: one lamp of two at $30 each}
    tags: [arithmetic, coreference]

  - id: depth-escalation-after-repeated-question
    category: depth
    bundle: support
    messages:
      - role: user
        content: Where is ORD-660011?
      - role: assistant
        content: It's still processing and hasn't shipped yet.
      - role: user
        content: That's what you told me three days ago. I want to speak to someone.
    expect:
      type: call
      tool: escalate_to_human
      arg_checks:
        - {path: summary, op: exists}
    tags: [coreference]

  # --- sequence: files bundle ----------------------------------------------
  - id: sequence-search-before-move
    category: sequence
    bundle: files
    messages:
      - role: user
        content: >
          Move the quarterly report into folder_archive_2026, I don't have
          the file id handy.
    expect:
      type: call
      tool: search_files
      arg_checks:
        - {path: query, op: exists}
    tags: [ordering]
    # move_file needs a file_id, which is not known yet, so search comes first.

  - id: sequence-list-before-delete
    category: sequence
    bundle: files
    messages:
      - role: user
        content: >
          Go through folder_temp_uploads and get rid of everything in it, I
          don't remember what's in there.
    expect:
      type: call
      tool: list_files
      args: {folder_id: folder_temp_uploads}
    tags: [ordering]
    # delete_file takes one file id at a time, so the folder has to be
    # listed before anything in it can be deleted.

  - id: sequence-search-before-share
    category: sequence
    bundle: files
    messages:
      - role: user
        content: >
          Share the file named onboarding_checklist with maya@example.com as
          a viewer, I don't know its id.
    expect:
      type: call
      tool: search_files
      arg_checks:
        - {path: query, op: contains, value: onboarding}
    tags: [ordering]

  - id: sequence-list-before-share-all
    category: sequence
    bundle: files
    messages:
      - role: user
        content: >
          Everything in folder_bids_2026 needs to go to legal@example.com as
          a viewer, I don't have individual file ids.
    expect:
      type: call
      tool: list_files
      args: {folder_id: folder_bids_2026}
    tags: [ordering]

  # --- sequence: scheduling bundle -------------------------------------------
  - id: sequence-availability-before-checkin
    category: sequence
    bundle: scheduling
    messages:
      - role: system
        content: Today is 2026-09-07.
      - role: user
        content: >
          Set up a 20 minute check-in with dana@example.com sometime
          tomorrow afternoon on cal_main, whatever's open.
    expect:
      type: call
      tool: find_availability
      args: {calendar_id: cal_main, duration_minutes: 20}
    tags: [ordering]

  - id: sequence-cancel-before-rebook
    category: sequence
    bundle: scheduling
    messages:
      - role: user
        content: >
          Cancel meeting mtg_1200, and then set up a new 30 minute slot on
          cal_main whenever's free for priya@example.com and
          omer@example.com.
    expect:
      type: call
      tool: cancel_meeting
      args: {meeting_id: mtg_1200}
    tags: [ordering]
    # Booking the replacement needs a free slot first anyway, but the
    # user's own ordering already makes cancellation the correct first call.

  # --- sequence: support bundle -----------------------------------------------
  - id: sequence-search-before-refund
    category: sequence
    bundle: support
    messages:
      - role: user
        content: >
          I don't have my order number, but refund the shampoo order for
          noa@example.com, it leaked everywhere.
    expect:
      type: call
      tool: search_orders
      args: {email: noa@example.com}
    tags: [ordering]

  - id: sequence-status-before-conditional-escalation
    category: sequence
    bundle: support
    messages:
      - role: user
        content: >
          Check on ORD-770044 for me, and if it's still not moving after two
          weeks like last time, get me a person.
    expect:
      type: call
      tool: get_order_status
      args: {order_id: ORD-770044}
    tags: [ordering]
    # Escalation is conditional on what the status check shows, so it
    # cannot be the first call.

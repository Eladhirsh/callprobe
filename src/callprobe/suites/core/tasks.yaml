name: core
# Twelve seed tasks. Each category exists because it fails for a different
# reason. Grow each to roughly 30 before publishing any numbers.
tasks:
  # --- select: the obvious case, and the near-miss case -------------------
  - id: select-status-direct
    category: select
    bundle: support
    messages:
      - role: user
        content: Where is my order ORD-448120?
    expect:
      type: call
      tool: get_order_status
      args: {order_id: ORD-448120}
    tags: [easy]

  - id: select-search-not-status
    category: select
    bundle: support
    messages:
      - role: user
        content: >
          I placed something last week and I can't find the confirmation.
          My email is dana@example.com. Has it shipped?
    expect:
      type: call
      tool: search_orders
      args: {email: dana@example.com}
    tags: [near-miss]
    # The trap: get_order_status is the tempting answer but there is no id.

  - id: select-escalate-explicit
    category: select
    bundle: support
    messages:
      - role: user
        content: I want to talk to a real person about this, now.
    expect:
      type: call
      tool: escalate_to_human
      arg_checks:
        - {path: summary, op: exists}
    tags: [easy]

  # --- abstain: no tool applies. Small models fail hardest here. ----------
  - id: abstain-policy-question
    category: abstain
    bundle: support
    messages:
      - role: user
        content: What is your return policy for opened electronics?
    expect:
      type: no_call
    tags: [knowledge]
    # Without this, padding hands the model a tool that genuinely answers
    # the question and the task silently stops testing abstention.
    exclude_distractors: [search_knowledge_base]

  - id: abstain-missing-identifier
    category: abstain
    bundle: support
    messages:
      - role: user
        content: Can you refund my order? It arrived broken.
    expect:
      type: no_call
    tags: [underspecified]
    # Correct behavior is to ask which order, not to invent an order id.

  - id: abstain-chitchat
    category: abstain
    bundle: scheduling
    messages:
      - role: user
        content: Thanks, that's all I needed. Have a good weekend.
    expect:
      type: no_call
    tags: [easy]

  # --- args: right tool, wrong values. The dangerous failure. -------------
  - id: args-partial-refund
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          Order ORD-991003 came to $84.50 and one of the two mugs was cracked.
          Refund me for just the broken one, they were the same price.
    expect:
      type: call
      tool: issue_refund
      args: {order_id: ORD-991003, reason: damaged}
      arg_checks:
        - {path: amount_cents, op: eq, value: 4225, note: half of 8450}
    tags: [arithmetic]

  - id: args-enum-mapping
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          I ordered a blue jacket on ORD-100200 and received a red one.
          Please refund it.
    expect:
      type: call
      tool: issue_refund
      args: {order_id: ORD-100200, reason: wrong_item}
    tags: [enum]

  - id: args-nested-address
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          Please send ORD-772341 to my new place instead: 55 Riverside Drive,
          apartment 12B, New York NY 10024, United States.
    expect:
      type: call
      tool: update_shipping_address
      args: {order_id: ORD-772341}
      arg_checks:
        - {path: address.postal_code, op: eq, value: "10024"}
        - {path: address.country, op: eq, value: US}
        - {path: address.city, op: eq, value: New York}
        - {path: address.line1, op: contains, value: Riverside}
    tags: [nested, normalization]

  - id: args-relative-dates
    category: args
    bundle: scheduling
    messages:
      - role: system
        content: Today is Monday, 2026-09-07. The user's timezone is America/New_York.
      - role: user
        content: Find me a free hour on my calendar cal_main sometime next week.
    expect:
      type: call
      tool: find_availability
      args: {calendar_id: cal_main, duration_minutes: 60}
      arg_checks:
        - {path: start_date, op: matches, value: "2026-09-1[2345]"}
        - {path: end_date, op: matches, value: "2026-09-(1[89]|20)"}
    tags: [dates]

  # --- depth: accuracy on turn one says nothing about turn nine ----------
  - id: depth-late-reference
    category: depth
    bundle: support
    messages:
      - role: user
        content: Hi, I have a question about a delivery.
      - role: assistant
        content: Of course. Do you have the order number?
      - role: user
        content: It's ORD-330045.
      - role: assistant
        content: Thanks. What would you like to know about it?
      - role: user
        content: Actually first, is the tracking showing anything yet?
      - role: assistant
        content: Let me check that for you.
      - role: user
        content: Wait, before that, just confirm the status of that order.
    expect:
      type: call
      tool: get_order_status
      args: {order_id: ORD-330045}
    tags: [coreference]

  # --- sequence: the first call in a chain, not the last ------------------
  - id: sequence-availability-first
    category: sequence
    bundle: scheduling
    messages:
      - role: system
        content: Today is 2026-09-07.
      - role: user
        content: >
          Book a 30 minute sync with priya@example.com on calendar cal_main
          on the first free slot this Thursday. Call it Weekly sync.
    expect:
      type: call
      tool: find_availability
      also_acceptable: []
      args: {calendar_id: cal_main, duration_minutes: 30}
    tags: [ordering]
    # book_meeting requires a slot known to be free, so calling it first is wrong.
  # =====================================================================
  # Batch two. Every expectation here is one a careful human would defend.
  # Where a reading was ambiguous, the prompt or the tool description was
  # tightened rather than the check widened.
  # =====================================================================

  # --- abstain ------------------------------------------------------------
  - id: abstain-status-no-identifier
    category: abstain
    bundle: support
    messages:
      - role: user
        content: Has my package gone out yet?
    expect:
      type: no_call
    tags: [underspecified]

  - id: abstain-no-such-capability
    category: abstain
    bundle: support
    messages:
      - role: user
        content: Please cancel order ORD-620114 before it ships.
    expect:
      type: no_call
    tags: [missing-capability]
    # Nothing here cancels an order. Refunding one is not the same action.

  - id: abstain-change-email-on-file
    category: abstain
    bundle: support
    messages:
      - role: user
        content: Can you update the email address on my account to elad@example.com?
    expect:
      type: no_call
    tags: [missing-capability]

  - id: abstain-shipping-quote
    category: abstain
    bundle: support
    messages:
      - role: user
        content: How much would it cost to ship a 2kg box to 10024?
    expect:
      type: no_call
    tags: [missing-capability]
    exclude_distractors: [get_shipping_rates]
    # get_shipping_rates answers this exactly, so padding must not add it.

  - id: abstain-availability-no-calendar
    category: abstain
    bundle: scheduling
    messages:
      - role: user
        content: Am I free for an hour on Tuesday afternoon?
    expect:
      type: no_call
    tags: [underspecified]
    # find_availability requires a calendar_id and none was given.

  - id: abstain-reschedule-unsupported
    category: abstain
    bundle: scheduling
    messages:
      - role: user
        content: Move my 3pm on Thursday to 4pm instead.
    expect:
      type: no_call
    tags: [missing-capability, underspecified]

  - id: abstain-cancel-without-id
    category: abstain
    bundle: scheduling
    messages:
      - role: user
        content: Cancel my standup tomorrow morning please.
    expect:
      type: no_call
    tags: [underspecified]

  - id: abstain-gratitude-midconversation
    category: abstain
    bundle: support
    messages:
      - role: user
        content: Where is ORD-118820?
      - role: assistant
        content: It shipped Tuesday and is due Friday.
      - role: user
        content: Perfect, thank you.
    expect:
      type: no_call
    tags: [easy, depth]

  # --- args ---------------------------------------------------------------
  - id: args-full-refund-omits-amount
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          ORD-450917 turned up three weeks after the delivery date. Refund the
          whole thing.
    expect:
      type: call
      tool: issue_refund
      args: {order_id: ORD-450917, reason: late}
      arg_checks:
        - {path: amount_cents, op: absent, note: omit to refund in full}
    tags: [omission]

  - id: args-dollars-to-cents
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          One item on ORD-771230 was a duplicate charge of $12.99. I changed my
          mind about that one, refund just that amount.
    expect:
      type: call
      tool: issue_refund
      args: {order_id: ORD-771230, reason: changed_mind}
      arg_checks:
        - {path: amount_cents, op: eq, value: 1299}
    tags: [units]

  - id: args-country-name-to-iso
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          Redirect ORD-310884 to 14 Bedford Square, London, WC1B 3JA,
          United Kingdom.
    expect:
      type: call
      tool: update_shipping_address
      args: {order_id: ORD-310884}
      arg_checks:
        - {path: address.country, op: eq, value: GB}
        - {path: address.postal_code, op: eq, value: WC1B 3JA}
        - {path: address.city, op: eq, value: London}
    tags: [normalization]
    # GB is the ISO code. UK is a common and wrong answer.

  - id: args-filtered-search
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          Show me the three most recent orders on noa@example.com that have
          already shipped.
    expect:
      type: call
      tool: search_orders
      args: {email: noa@example.com, status: shipped, limit: 3}
    tags: [enum, optional-args]

  - id: args-duration-in-words
    category: args
    bundle: scheduling
    messages:
      - role: system
        content: Today is 2026-09-07.
      - role: user
        content: >
          Find me an hour and a half on cal_design between the 9th and the
          11th of this month.
    expect:
      type: call
      tool: find_availability
      args:
        calendar_id: cal_design
        duration_minutes: 90
        start_date: "2026-09-09"
        end_date: "2026-09-11"
    tags: [units]

  - id: args-explicit-datetime
    category: args
    bundle: scheduling
    messages:
      - role: system
        content: >
          Today is 2026-09-07. The user is in America/New_York, which is at
          UTC-04:00 on this date.
      - role: user
        content: >
          Book 45 minutes on cal_main this Wednesday at 2pm with
          omer@example.com and tal@example.com. Title it Design review.
    expect:
      type: call
      tool: book_meeting
      args: {calendar_id: cal_main, duration_minutes: 45, title: Design review}
      arg_checks:
        - {path: start_time, op: matches, value: "2026-09-09T14:00(:00)?-04:00"}
        - {path: attendees.0, op: exists}
        - {path: attendees.1, op: exists}
    tags: [dates, arrays]

  - id: args-boolean-from-instruction
    category: args
    bundle: scheduling
    messages:
      - role: user
        content: Cancel meeting mtg_4471, and do not send anyone a notification.
    expect:
      type: call
      tool: cancel_meeting
      args: {meeting_id: mtg_4471, notify_attendees: false}
    tags: [booleans]

  - id: args-escalation-urgency
    category: args
    bundle: support
    messages:
      - role: user
        content: >
          This is the fourth time I have asked and my wedding is Saturday.
          I want to speak to a person right now.
    expect:
      type: call
      tool: escalate_to_human
      arg_checks:
        - {path: summary, op: exists}
        - {path: urgency, op: eq, value: high}
    tags: [enum, inference]

  # --- select -------------------------------------------------------------
  - id: select-address-change
    category: select
    bundle: support
    messages:
      - role: user
        content: >
          ORD-905512 has not shipped yet and I moved last weekend. I need it
          going somewhere else.
    expect:
      type: call
      tool: update_shipping_address
      args: {order_id: ORD-905512}
    tags: [near-miss]

  - id: select-cancel-with-id
    category: select
    bundle: scheduling
    messages:
      - role: user
        content: Drop meeting mtg_2210 from the calendar.
    expect:
      type: call
      tool: cancel_meeting
      args: {meeting_id: mtg_2210}
    tags: [easy]

  - id: select-availability-not-booking
    category: select
    bundle: scheduling
    messages:
      - role: system
        content: Today is 2026-09-07.
      - role: user
        content: >
          What thirty minute slots are open on cal_ops between the 14th and
          the 18th? Do not book anything yet.
    expect:
      type: call
      tool: find_availability
      args:
        calendar_id: cal_ops
        duration_minutes: 30
        start_date: "2026-09-14"
        end_date: "2026-09-18"
    tags: [ordering]

  # --- depth --------------------------------------------------------------
  - id: depth-corrected-identifier
    category: depth
    bundle: support
    messages:
      - role: user
        content: Can you check on ORD-111111 for me?
      - role: assistant
        content: Sure, one moment.
      - role: user
        content: Sorry, wrong number. It is ORD-222222.
    expect:
      type: call
      tool: get_order_status
      args: {order_id: ORD-222222}
    tags: [correction]

  - id: depth-reason-stated-earlier
    category: depth
    bundle: support
    messages:
      - role: user
        content: The blender on ORD-664200 arrived with a cracked jug.
      - role: assistant
        content: I am sorry about that. Would you like a replacement or a refund?
      - role: user
        content: A refund for the whole order, please.
    expect:
      type: call
      tool: issue_refund
      args: {order_id: ORD-664200, reason: damaged}
      arg_checks:
        - {path: amount_cents, op: absent}
    tags: [coreference, omission]

  # --- sequence -----------------------------------------------------------
  - id: sequence-address-before-status
    category: sequence
    bundle: support
    messages:
      - role: user
        content: >
          First change the delivery address on ORD-505050 to 9 Alon Street,
          Tel Aviv, 6100000, Israel, and then tell me the delivery estimate.
    expect:
      type: call
      tool: update_shipping_address
      args: {order_id: ORD-505050}
      arg_checks:
        - {path: address.country, op: eq, value: IL}
    tags: [ordering]
